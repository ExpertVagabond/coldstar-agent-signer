name: release

# Publishes to npm with provenance when a v* tag is pushed. Provenance links the
# published tarball to this workflow run and the commit it was built from, so
# "the code you can read is the code you installed" is checkable rather than
# trusted. It requires publishing from CI with an OIDC token, which is why this
# exists instead of `npm publish` from a laptop.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci --ignore-scripts

      # Never publish something that does not pass its own tests.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # dist/ is committed; a release must not ship one that differs from src/.
      - name: dist is in sync with src
        run: git diff --exit-code -- dist || (echo "::error::dist/ is stale — run npm run build and commit" && exit 1)

      # The tag must match the version being published.
      - name: tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $TAG does not match package version $PKG"
            exit 1
          fi

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
